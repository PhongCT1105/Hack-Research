[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outreach-eval"
version = "0.1.0"
description = "Claim-level factuality evaluation of AI-generated professor outreach emails (2x2 grounding x verification study)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "anthropic>=0.40",
    "openai>=1.50",
    "tenacity>=8.2",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
analysis = [
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "jupyter",
    "scikit-learn>=1.5",
    "scipy>=1.11",
]
# Building the NSRI-compliant .docx submission (scripts/build_submission_docx.py).
paper = [
    "python-docx>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/outreach_eval"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
