# Provider-agnostic run configuration.
# Each role picks its own provider + model. Prefer DIFFERENT model families for
# writer, verifier, and auto-evaluator to avoid shared blind spots (see CLAUDE.md).

roles:
  writer:
    provider: anthropic          # anthropic | openai | mock
    model: claude-sonnet-5
    temperature: 0.7
    max_tokens: 600              # identical output budget across ALL conditions
  verifier:
    provider: openai
    model: gpt-5.2
    temperature: 0.0
    max_tokens: 1500
  claim_extractor:
    provider: openai
    model: gpt-5.2
    temperature: 0.0
    max_tokens: 1500

prompts:
  writer: prompts/writer_v1.md
  verifier: prompts/verifier_v1.md
  claim_extractor: prompts/claim_extractor_v1.md

experiment:
  conditions: [A, B, C, D]
  seeds: [1, 2]                  # 2 for pilot; 3 for full study
  email_word_limit: 220          # stated in the writer prompt; constant across conditions

paths:
  evidence_dir: data/evidence
  professors_csv: data/professors.csv
  outputs_dir: outputs
  logs_dir: logs

pilot:
  professor_ids: [CS-01, PSY-01]   # first two real packets; use MOCK-01 for dry runs
